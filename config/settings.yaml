output_root: "output"
baseline_scan_id: ""

scope:
  check_dns: true

timeouts:
  http_connect_sec: 10
  http_read_sec: 20
  max_redirects: 5
  subfinder_sec: 120
  assetfinder_sec: 120
  amass_sec: 300
  bbot_sec: 300
  directory_scan_sec: 420
  directory_stage_sec: 1800
  katana_sec: 120
  feroxbuster_sec: 420
  gau_sec: 120
  waybackurls_sec: 120
  httpx_sec: 120
  http_probe_stage_sec: 900
  redirect_stage_sec: 600
  tls_stage_sec: 1200
  dns_stage_sec: 600
  api_intel_stage_sec: 600
  authz_stage_sec: 600
  logic_stage_sec: 300
  security_review_stage_sec: 900
  whatweb_sec: 120
  nuclei_sec: 900
  tls_sec: 10
  dns_sec: 8
  whois_sec: 10

limits:
  max_urls_per_stage: 2500
  http_probe_max_failure_ratio: 0.5
  redirect_max_failure_ratio: 0.5
  tls_max_failure_ratio: 0.5
  max_testssl_origins: 5
  max_api_inventory_endpoints: 5000
  deep_checks_max_failure_ratio: 0.5
  header_review_max_failure_ratio: 0.5
  max_header_review_endpoints: 500
  max_directory_words: 25000
  max_concurrent_requests: 10
  max_total_requests: 60000
  requests_per_host_per_sec: 10
  max_response_bytes: 5242880
  max_external_processes: 1000
  max_concurrent_processes: 3
  max_process_output_bytes: 2097152
  max_scan_duration_sec: 14400
  user_agent: "Quiver/0.1.0"

browser:
  headless: true
  lab_mode: false  # set true only for loopback/private lab targets
  max_pages: 60
  max_depth: 3
  navigation_timeout_ms: 15000
  settle_wait_ms: 1200
  capture_screenshots: true
  max_screenshots: 30
  max_identities: 5
  max_console_events: 500
  record_har: true
  har_mode: "minimal"
  max_attempts: 120                 # total navigations incl. failures (default 2 x max_pages)
  max_crawl_sec_per_identity: 600  # wall-clock cap per identity
  max_stage_sec: 1800              # wall-clock cap for the whole browser stage
  max_consecutive_failures: 5      # stop an identity after N failed navigations in a row
  max_query_variants_per_path: 3   # crawl-trap guard for ?page=1..N style URLs
  max_seed_hosts: 10
  block_resource_types: ["media", "font"]
  katana_enabled: true
  katana_timeout_sec: 300
  katana_request_timeout_sec: 10
  katana_concurrency: 3
  katana_rate_limit: 3
  katana_max_response_bytes: 1048576
  viewport:
    width: 1366
    height: 768

wordlists:
  # Point this to your larger wordlist (e.g. fetched via scripts/fetch_wordlists.sh)
  directories: "config/wordlists/quiver-directories.txt"

tls:
  verify_certificates: true

nuclei:
  max_targets: 300
  # true = run nuclei even when scope.yaml has excluded_paths (targets still scope-filtered)
  allow_with_excluded_paths: true
  rate_limit: 25
  concurrency: 10
  bulk_size: 10
  severities: "low,medium,high,critical"
  templates_dir: ""
  inactivity_timeout_sec: 180

deep_checks:
  max_authz_endpoints: 400
  max_logic_endpoints: 400
  # No state-changing probes are performed by Step 7.
  allow_state_changing_probes: false
  # Rewrite-header checks are read-only but opt-in because they alter routing behavior.
  enable_rewrite_header_probes: true
  # The largest pagination value Step 7 will send in a GET request.
  max_pagination_probe_value: 1000
  # Read-only GET parameter canary probes (reflection, open redirect, error leaks).
  enable_parameter_canary: true
  max_canary_endpoints: 100
  max_canary_params_per_endpoint: 5

ai_triage:
  enabled: true
  # Supported providers: openrouter, groq, gemini, meta, openai, local.
  # Remote provider traffic remains subject to the host egress guard/proxy.
  # Use provider=local for a loopback OpenAI-compatible endpoint (for example Ollama).
  provider: "meta"
  model: "muse-spark-1.3"
  endpoint_url: "https://api.meta.ai/v1"
  allowed_hosts: []
  timeout_sec: 20
  max_findings: 99