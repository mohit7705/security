[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-analyzer"
version = "0.1.0"
description = "Quiver — Scope-enforced, evidence-driven web application security assessment pipeline"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "urllib3>=2.0.7",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
quiver = "security_analyzer.cli:main"
attack = "security_analyzer.cli:main"
security-analyzer = "security_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]