services:
  security-analyzer:
    build: &quiver-build
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-true}

    image: security-analyzer:latest
    pull_policy: build
    container_name: security-analyzer

    # Keep the scanner container alive for interactive CLI execution.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ -L /home/scanner/nuclei-templates ] && rm -f /home/scanner/nuclei-templates || true
        [ -e /home/scanner/nuclei-templates ] || ln -s /app/config/nuclei-templates /home/scanner/nuclei-templates
        while :; do sleep 3600; done

    depends_on:
      egress-proxy:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      SECURITY_ANALYZER_PROXY: "http://egress-proxy:3128"
      SECURITY_ANALYZER_PROXY_TRANSPORT: "docker"
      SECURITY_ANALYZER_EGRESS_ENFORCED: "1"
      # This container is on an internal network with no DNS; the egress proxy resolves and validates names.
      SECURITY_ANALYZER_DNS_DELEGATED_TO_PROXY: "1"

      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"
      ALL_PROXY: "http://egress-proxy:3128"

      http_proxy: "http://egress-proxy:3128"
      https_proxy: "http://egress-proxy:3128"
      all_proxy: "http://egress-proxy:3128"

      NO_PROXY: "localhost,127.0.0.1,::1,egress-proxy"
      no_proxy: "localhost,127.0.0.1,::1,egress-proxy"

      HOME: "/home/scanner"
      XDG_CONFIG_HOME: "/home/scanner/.config"
      XDG_CACHE_HOME: "/home/scanner/.cache"

      TERM: "${TERM:-xterm-256color}"

    volumes:
      - ./config/nuclei-templates:/home/scanner/nuclei-templates:ro
      - ./config:/app/config:ro
      - ./output:/app/output
      - ./secrets:/app/secrets

    networks:
      - scanner_internal

    mem_limit: 3g
    cpus: "2.0"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    init: true
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /home/scanner:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700

    healthcheck:
      test:
        - CMD
        - quiver
        - doctor
        - --profile
        - core-only
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  egress-proxy:
    # Build from the same local image instead of trying to pull
    # security-analyzer:latest from a remote registry.
    build: *quiver-build

    image: security-analyzer:latest
    pull_policy: build
    container_name: security-analyzer-egress-proxy

    entrypoint:
      - python
      - -m
      - security_analyzer.egress_proxy

    command:
      - --scope
      - /app/config/scope.yaml
      - --host
      - 0.0.0.0
      - --port
      - "3128"

    env_file:
      - path: .env
        required: false

    environment:
      HOME: "/home/scanner"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./config:/app/config:ro

    networks:
      - scanner_internal
      - scanner_egress

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    init: true
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /home/scanner:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 3128), timeout=2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Opt-in isolated benchmark target.
  # It is not started by the default profile.
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    profiles: ["lab"]

    container_name: quiver-juice-shop-lab

    networks:
      - scanner_internal

    restart: "no"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    init: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

networks:
  scanner_internal:
    internal: true

  scanner_egress:
    driver: bridge